<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For My Baby, Nandani 💖</title>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #fbc2eb 0%, #a6c1ee 100%);
            background-attachment: fixed;
            color: #333;
            overflow: hidden; /* Lock body scrolling to force slider scrolling */
            text-align: center;
        }

        /* Falling Flowers Background */
        .petal {
            position: fixed;
            top: -10vh;
            font-size: 1.5rem;
            animation: fall linear infinite;
            z-index: 0;
            pointer-events: none;
            opacity: 0.7;
        }
        @keyframes fall {
            0% { transform: translateY(-10vh) rotate(0deg) translateX(0); }
            100% { transform: translateY(110vh) rotate(360deg) translateX(50px); }
        }

        /* Navigation Menu - Fixed at Top */
        nav {
            background: rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(10px);
            padding: 15px;
            position: fixed;
            width: 100%;
            top: 0;
            z-index: 100;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            display: flex;
            justify-content: center;
            gap: 10px;
        }
        nav button {
            background: #ff7eb3;
            border: none;
            padding: 10px 20px;
            border-radius: 20px;
            color: white;
            font-weight: 600;
            font-family: 'Poppins', sans-serif;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 4px 10px rgba(255, 126, 179, 0.4);
        }
        nav button:hover, nav button.active {
            background: #ff4785;
            transform: scale(1.1);
        }

        /* --- SLIDER LAYOUT --- */
        .slider-container {
            display: flex;
            width: 100vw;
            height: 100vh;
            overflow-x: auto;
            overflow-y: hidden;
            scroll-snap-type: x mandatory;
            scroll-behavior: smooth;
            -webkit-overflow-scrolling: touch;
        }
        
        /* Hide slider scrollbar */
        .slider-container::-webkit-scrollbar { display: none; }
        .slider-container { -ms-overflow-style: none; scrollbar-width: none; }

        .slide {
            flex: 0 0 100vw;
            width: 100vw;
            height: 100vh;
            scroll-snap-align: start;
            overflow-y: auto;
            padding: 90px 20px 100px 20px; /* 90px top padding so Nav bar doesn't cover content */
            position: relative;
            z-index: 10;
        }

        /* Custom scrollbar for inside slides */
        .slide::-webkit-scrollbar { width: 6px; }
        .slide::-webkit-scrollbar-track { background: transparent; }
        .slide::-webkit-scrollbar-thumb { background: #ff7eb3; border-radius: 10px; }

        h1 {
            font-family: 'Dancing Script', cursive;
            font-size: 4rem;
            color: #ff4785;
            margin-bottom: 20px;
            text-shadow: 2px 2px 4px rgba(255,255,255,0.7);
        }

        /* --- SLIDE 1: GALLERY --- */
        .gallery-grid {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 30px;
            max-width: 1000px;
            margin: 0 auto 50px auto;
        }
        .photo-card {
            background: white;
            padding: 15px 15px 25px 15px;
            border-radius: 10px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            transform: rotate(-2deg);
            transition: transform 0.3s;
            width: 300px;
        }
        .photo-card:nth-child(even) { transform: rotate(2deg); }
        .photo-card:hover { transform: scale(1.05) rotate(0deg); z-index: 20; }
        .photo-card img {
            width: 100%;
            height: 250px;
            object-fit: cover;
            border-radius: 5px;
        }
        .photo-caption {
            font-family: 'Dancing Script', cursive;
            font-size: 1.8rem;
            color: #ff4785;
            margin-top: 10px;
        }

        /* Animated Bouquets */
        .bouquets-container {
            display: flex;
            justify-content: space-around;
            pointer-events: none;
            margin-top: 20px;
        }
        .bouquet {
            font-size: 4rem;
            animation: sway 3s ease-in-out infinite alternate;
            transform-origin: bottom center;
        }
        .bouquet:nth-child(2) { animation-delay: 0.5s; font-size: 5rem; }
        .bouquet:nth-child(3) { animation-delay: 1s; font-size: 3.5rem; }
        .bouquet:nth-child(4) { animation-delay: 1.5s; font-size: 4.5rem; }
        .bouquet:nth-child(5) { animation-delay: 2s; font-size: 4rem; }
        @keyframes sway {
            from { transform: rotate(-15deg); }
            to { transform: rotate(15deg); }
        }

        /* --- SLIDE 2: 100 REASONS --- */
        .envelopes-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }
        .envelope-wrapper {
            position: relative;
            width: 100%;
            height: 150px;
            background: #e07a93;
            border-radius: 10px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            overflow: hidden;
            transition: all 0.3s;
            display: flex;
            align-items: flex-end;
            justify-content: center;
        }
        .envelope-flap {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 50%;
            background: #ff9a9e;
            clip-path: polygon(0 0, 100% 0, 50% 100%);
            z-index: 3;
            transition: transform 0.4s;
            transform-origin: top;
        }
        .envelope-front {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: transparent;
            z-index: 4;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: white;
            font-size: 1.2rem;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.3);
            pointer-events: none;
        }
        .envelope-front::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 70%;
            background: #ff7eb3;
            clip-path: polygon(0 100%, 100% 100%, 100% 0, 50% 40%, 0 0);
        }
        .letter {
            position: absolute;
            bottom: 10px;
            width: 90%;
            height: 90%;
            background: white;
            border-radius: 5px;
            padding: 10px;
            font-size: 0.85rem;
            color: #333;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            box-shadow: 0 0 5px rgba(0,0,0,0.2);
            transition: transform 0.4s ease;
            z-index: 2;
        }
        .envelope-wrapper:hover .envelope-flap, 
        .envelope-wrapper.open .envelope-flap { transform: rotateX(180deg); }
        .envelope-wrapper:hover .letter,
        .envelope-wrapper.open .letter { transform: translateY(-40px); z-index: 5; }

        /* --- SLIDE 3: THE GAME --- */
        .game-container {
            background: rgba(255, 255, 255, 0.7);
            max-width: 600px;
            margin: 50px auto;
            padding: 50px 20px;
            border-radius: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            position: relative;
        }
        .game-container img {
            width: 200px;
            border-radius: 20px;
            margin-bottom: 20px;
        }
        .btn-container {
            position: relative;
            height: 150px;
            margin-top: 30px;
            width: 100%;
        }
        .game-btn {
            font-family: 'Poppins', sans-serif;
            font-size: 1.2rem;
            padding: 12px 35px;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            font-weight: bold;
            transition: transform 0.2s;
        }
        #yesBtn {
            background: #4cd137;
            color: white;
            box-shadow: 0 4px 15px rgba(76, 209, 55, 0.4);
            position: absolute;
            left: 20%;
        }
        #noBtn {
            background: #e84118;
            color: white;
            box-shadow: 0 4px 15px rgba(232, 65, 24, 0.4);
            position: absolute;
            right: 20%;
        }
        #successMessage {
            display: none;
            margin-top: 20px;
            font-family: 'Dancing Script', cursive;
            font-size: 2.5rem;
            color: #ff4785;
        }
    </style>
</head>
<body>

    <!-- Falling Flowers Background -->
    <div id="petals-container"></div>

    <!-- Sticky Navigation Menu -->
    <nav>
        <button onclick="scrollToSlide(0)" class="nav-btn active">Our Gallery</button>
        <button onclick="scrollToSlide(1)" class="nav-btn">100 Reasons</button>
        <button onclick="scrollToSlide(2)" class="nav-btn">For You</button>
    </nav>

    <!-- MAIN SLIDER -->
    <div class="slider-container" id="main-slider">
        
        <!-- SLIDE 1: GALLERY -->
        <section class="slide" id="slide0">
            <h1>Hello Baby 💖</h1>
            <div class="gallery-grid">
                <div class="photo-card">
                    <img src="photo1.jpg" alt="Beautiful memory">

            </div>
            
            <!-- Animated Bouquets -->
            <div class="bouquets-container">
                <div class="bouquet">💐</div>

                <div class="bouquet">💐</div>
                <div class="bouquet">💐</div>
                <div class="bouquet">💐</div>
            </div>
        </section>

        <!-- SLIDE 2: 100 REASONS -->
        <section class="slide" id="slide1">
            <h1>100 Reasons Why I Love You</h1>
            <div class="envelopes-grid" id="envelopes-grid">
                <!-- Injected by JavaScript -->
            </div>
        </section>

        <!-- SLIDE 3: THE GAME -->
        <section class="slide" id="slide2">
            <div class="game-container">
                <img src="https://media.tenor.com/ef39nFY8b4MAAAAi/bubu-dudu-bubu.gif" alt="Cute Bears">
                <h1>Will you be my forever, baby?</h1>
                <div class="btn-container">
                    <button id="yesBtn" class="game-btn">Yes! 💖</button>
                    <button id="noBtn" class="game-btn">No 😢</button>
                </div>
                <div id="successMessage">I knew you would say yes! I love you! 🥰🎉</div>
            </div>
        </section>

    </div>

    <script>
        // --- Slider Navigation Logic ---
        const slider = document.getElementById('main-slider');
        const navBtns = document.querySelectorAll('.nav-btn');

        // Click to scroll
        function scrollToSlide(index) {
            const slideWidth = window.innerWidth;
            slider.scrollTo({
                left: index * slideWidth,
                behavior: 'smooth'
            });
        }

        // Update active button on swipe/scroll
        slider.addEventListener('scroll', () => {
            let activeIndex = Math.round(slider.scrollLeft / window.innerWidth);
            navBtns.forEach(btn => btn.classList.remove('active'));
            if(navBtns[activeIndex]) navBtns[activeIndex].classList.add('active');
        });

        // --- Falling Petals Logic ---
        const petalsContainer = document.getElementById('petals-container');
        const flowers = ['🌸', '🌺', '💮', '💖'];
        
        function createPetal() {
            const petal = document.createElement('div');

            petal.style.animationDuration = (Math.random() * 5 + 5) + 's';
            petal.style.fontSize = (Math.random() * 1 + 1) + 'rem';
            petalsContainer.appendChild(petal);
            setTimeout(() => petal.remove(), 10000);
        }
        setInterval(createPetal, 400);

        // --- 100 Reasons Logic ---
        const reasons = [

            "How comfortable we are in total silence.",
            "Your cute little habits.",

            "How you always know how to cheer me up.",
            "Your ambition and drive to succeed.",
            "The warmth of your hugs.",
            "How safe I feel when talking to you.",
            "Your amazing sense of humor.",
            "The way you challenge me to think differently.",
            "How you remember the smallest details about me.",
            "Your kindness, which is truly beautiful.",
            "The perfect way you say my name.",
            "How our late-night calls end my day perfectly.",
            "Your determination to overcome obstacles.",
            "How gorgeous you look in every photo.",
            "The way you make the miles between us feel small.",
            "Your wonderful taste in music.",
            "How you inspire me to work hard.",
            "How sweet you are when you're sleepy.",
            "Your unwavering honesty.",
            "The cute faces you make on video calls.",
            "How perfectly our personalities balance.",
            "Your passionate heart.",
            "The way you make tomorrow exciting.",
            "How you are my best friend and soulmate.",
            "Your gentle touch that I constantly crave.",
            "The way you handle stress with grace.",
            "How quickly you forgive my mistakes.",
            "Your endless capacity for empathy.",
            "The way you brighten up any video call.",
            "How you push me out of my comfort zone.",

            "Your resilience when things get tough.",
            "The way you make me feel so lucky.",
            "How our love story is my absolute favorite.",
            "Your optimism for our future.",
            "The sweet texts you send out of nowhere.",
            "How you're my first thought every morning.",
            "And my last thought before sleep.",
            "Your gorgeous hair.",

            "The way you make life feel like a fairy tale.",

            "The way every goodbye is a promise for a better hello.",
            "How you are my forever.",
            "Simply because you are my baby, Nandani."
        ];

        const grid = document.getElementById('envelopes-grid');
        reasons.forEach((reason, index) => {
            const wrapper = document.createElement('div');
            wrapper.className = 'envelope-wrapper';
            wrapper.onclick = function() { this.classList.toggle('open'); };
            
            wrapper.innerHTML = `
                <div class="envelope-flap"></div>
                <div class="letter">#${index + 1}: ${reason}</div>
                <div class="envelope-front">Reason ${index + 1}</div>
            `;
            grid.appendChild(wrapper);
        });

        // --- Game Logic ---
        const noBtn = document.getElementById('noBtn');
        const yesBtn = document.getElementById('yesBtn');
        const successMessage = document.getElementById('successMessage');

        function moveNoButton() {
            const container = document.querySelector('.btn-container');
            const containerRect = container.getBoundingClientRect();
            const btnRect = noBtn.getBoundingClientRect();

            const maxX = containerRect.width - btnRect.width;
            const maxY = containerRect.height - btnRect.height;

            const randomX = Math.max(0, Math.floor(Math.random() * maxX));
            const randomY = Math.max(0, Math.floor(Math.random() * maxY));

            noBtn.style.position = 'absolute';
            noBtn.style.left = randomX + 'px';
            noBtn.style.top = randomY + 'px';
        }

        noBtn.addEventListener('mouseover', moveNoButton);
        noBtn.addEventListener('touchstart', (e) => {
            e.preventDefault(); 
            moveNoButton();
        });

        yesBtn.addEventListener('click', () => {
            successMessage.style.display = 'block';
            noBtn.style.display = 'none';
            yesBtn.style.display = 'none';
            
            for(let i=0; i<40; i++) setTimeout(createPetal, i*50);
        });
    </script>
</body>
</html>
