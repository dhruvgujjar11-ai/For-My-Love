<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For My Baby, Nandani 💖</title>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(-45deg, #0f0c29, #302b63, #24243e, #4a00e0);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            color: white;
            overflow-x: hidden;
            text-align: center;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        header {
            padding: 50px 20px;
            text-shadow: 2px 2px 10px rgba(0,0,0,0.5);
        }

        h1 {
            font-family: 'Dancing Script', cursive;
            font-size: 4rem;
            color: #ff9a9e;
            margin-bottom: 10px;
        }

        h2 {
            font-size: 1.5rem;
            font-weight: 300;
            color: #fecfef;
        }

        .gallery-container {
            max-width: 1000px;
            margin: 40px auto;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 30px;
            padding: 20px;
        }

        .media-card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 15px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .media-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 15px 45px rgba(255, 154, 158, 0.4);
        }

        .media-card img, .media-card video {
            width: 100%;
            height: 250px;
            object-fit: cover;
            border-radius: 15px;
            margin-bottom: 10px;
        }

        .media-caption {
            font-family: 'Dancing Script', cursive;
            font-size: 1.8rem;
            color: #ff9a9e;
        }

        .reasons-section {
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
        }

        .reasons-title {
            font-family: 'Dancing Script', cursive;
            font-size: 3rem;
            color: #ff9a9e;
            margin-bottom: 30px;
        }

        .reasons-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 15px;
            max-height: 600px;
            overflow-y: auto;
            padding: 20px;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        /* Custom Scrollbar for Reasons */
        .reasons-grid::-webkit-scrollbar {
            width: 8px;
        }
        .reasons-grid::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.1); 
            border-radius: 10px;
        }
        .reasons-grid::-webkit-scrollbar-thumb {
            background: #ff9a9e; 
            border-radius: 10px;
        }

        .reason-card {
            background: rgba(255, 255, 255, 0.05);
            padding: 15px;
            border-radius: 12px;
            border-left: 4px solid #ff9a9e;
            text-align: left;
            font-size: 0.95rem;
            transition: all 0.3s;
        }

        .reason-card:hover {
            background: rgba(255, 255, 255, 0.15);
            transform: scale(1.02);
        }

        .reason-number {
            font-weight: bold;
            color: #ff9a9e;
            margin-right: 5px;
        }

        /* Floating Hearts */
        .heart {
            position: fixed;
            top: -10vh;
            font-size: 1.5rem;
            animation: fall linear infinite;
            z-index: -1;
            opacity: 0.6;
        }

        @keyframes fall {
            to {
                transform: translateY(110vh) rotate(360deg);
            }
        }
    </style>
</head>
